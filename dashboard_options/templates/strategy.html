<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>策略详情</title><style>:root{--ink:#102620;--green:#0e7666;--paper:#f7faf8;--line:#dbe6df;--muted:#63746e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{background:var(--ink);color:white}.bar,main{max-width:1000px;margin:auto}.bar{padding:18px 24px;display:flex;justify-content:space-between}.bar a{color:#d4eee5;text-decoration:none}main{padding:38px 24px 64px}.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--green);font-weight:700}h1{font-size:34px;line-height:1.3;margin:6px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.card span{display:block;color:var(--muted);font-size:12px}.card b{font-size:20px}.panel{margin:14px 0}.panel h2{font-size:18px;margin:0 0 8px}.timeline{padding-left:20px}.chart{width:100%;height:210px;background:#f7faf8;border-radius:8px}.warn{background:#fff8e9;border-color:#ead6aa;color:#785310}@media(max-width:620px){main{padding:28px 16px}.bar{padding:15px 16px}.grid{grid-template-columns:1fr}h1{font-size:29px}}</style></head><body><header><div class="bar"><strong>期权研究看板</strong><a href="../index.html">← 返回总览</a></div></header><main><div id="app"></div></main><script id="payload" type="application/json">__PAYLOAD_JSON__</script><script>
'use strict';const d=JSON.parse(document.getElementById('payload').textContent),id='__STRATEGY_ID__',s=d.research.covered_call.find(x=>x.id===id),f=(v,n=2)=>typeof v==='number'&&Number.isFinite(v)?v.toFixed(n):'—',p=v=>typeof v==='number'?`${(v*100).toFixed(2)}%`:'—',money=v=>typeof v==='number'?v.toLocaleString('zh-CN',{maximumFractionDigits:0}):'—';if(!s)throw Error('策略不存在');document.title=s.title+' · 期权研究';let a=s.parameters,st=s.stress,fs=s.frozen_state;document.getElementById('app').innerHTML=`<div class="eyebrow">${s.family} · ${s.selection}规则</div><h1>${s.title}</h1><p class="muted">冻结研究数据截至 ${s.research_as_of}。当前页面的状态卡仅对应冻结回测末日，不等于今天的交易建议。</p><section class="grid"><div class="card"><span>BASE / STRESS 累计收益</span><b>${p(s.base.net_return)} / ${p(st.net_return)}</b></div><div class="card"><span>STRESS 最大回撤</span><b>${p(st.Max_Drawdown)}</b></div><div class="card"><span>STRESS 最大融资/NAV</span><b>${p(st.Maximum_Financing_NAV)}</b></div></section><section class="panel"><h2>规则怎么做</h2><p>目标期限 ${a.target_dte} 个自然日，到期前 ${a.roll_dte} 个交易日处理换月；目标覆盖率 ${p(a.coverage_ratio)}。${s.selection==='执行价距离'?`新开仓选择约 ${p(a.target_otm)} 的价外Call。`:`新开仓选择Delta约 ${f(a.target_delta)} 的Call。`} 信号在T日收盘形成，T+1按研究假设执行。</p></section><section class="panel"><h2>为什么放入观察列表</h2><p>${s.why_watch}</p><p class="muted">BASE代表0.5%期权比例滑点、每张每边2元佣金与6%融资；STRESS为1%、2元与8%。两套成本假设都保留，避免只展示单一乐观结果。</p></section><section class="panel"><h2>冻结回测末日状态</h2><div class="grid"><div class="card"><span>日期 / ETF价格</span><b>${fs.date} / ${f(fs.etf_price,3)}</b></div><div class="card"><span>空头Call / 张数</span><b>${fs.short_call_code||'无'} / ${f(fs.contracts,0)}</b></div><div class="card"><span>执行价 / 剩余交易日</span><b>${f(fs.strike,3)} / ${f(fs.trading_dte,0)}</b></div><div class="card"><span>覆盖率 / Delta</span><b>${p(fs.coverage)} / ${f(fs.current_delta,3)}</b></div><div class="card"><span>现金 / 融资</span><b>${money(fs.cash)} / ${money(fs.financing)}</b></div><div class="card"><span>回测状态</span><b>${fs.state} · ${fs.next_action}</b></div></div></section><section class="panel"><h2>净值与基准（共同区间，BASE）</h2><svg class="chart" viewBox="0 0 760 210" id="chart"></svg><p class="muted">绿色为策略NAV，灰色为同期同资本ETF基准。曲线是历史净值，不是收益预测。</p></section><section class="panel"><h2>研究历程</h2><ol class="timeline">${s.timeline.map(x=>`<li><strong>${x[0]}</strong>：${x[1]}</li>`).join('')}</ol></section><section class="panel warn"><h2>风险、失效条件与不能做什么</h2><p>${s.limitations}</p><p>公司行动、合约调整、到期平仓失败、长假、停牌和报价缺失都可能使实盘路径不同。页面不生成当日选约或“持有/开仓/平仓”结论。</p></section>`;const rows=s.history,svg=document.getElementById('chart'),vals=rows.flatMap(r=>[r.nav,r.benchmark]),lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo)*.07||1;lo-=pad;hi+=pad;let path=(key)=>rows.map((r,i)=>`${i?'L':'M'}${(i*720/Math.max(rows.length-1,1)+12).toFixed(1)},${(190-(r[key]-lo)*170/(hi-lo)).toFixed(1)}`).join(' ');svg.innerHTML=`<path d="${path('benchmark')}" fill="none" stroke="#9cadA6" stroke-width="2"/><path d="${path('nav')}" fill="none" stroke="#0e7666" stroke-width="2.5"/><text x="12" y="205" fill="#63746e" font-size="11">${rows[0].date}</text><text x="650" y="205" fill="#63746e" font-size="11">${rows.at(-1).date}</text>`;
</script></body></html>
